<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4e9d8">
<title>Pico-Clinic</title>
<meta name="description" content="Répare drones, insectes cybernétiques et mascottes mécaniques du bout du doigt.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pico-Clinic">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Pico-Clinic">
<meta property="og:image" content="couverture.webp">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<script>
  // fiche d'installation en anglais si le jeu est en anglais (lien ?lang=, choix mémorisé ou langue du téléphone)
  (function () {
    var l = new URLSearchParams(location.search).get('lang');
    try { l = l || (JSON.parse(localStorage.getItem('pico_save_v1') || '{}').settings || {}).lang; } catch (e) {}
    l = l || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
    if (l === 'en') document.getElementById('manifest').href = 'manifest-en.webmanifest';
  })();
</script>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* fond noir pendant le logo du studio, puis beige en fondu (bandes autour du jeu) */
  body { display: flex; align-items: center; justify-content: center; background: #e9dcc6; transition: background-color .7s; }
  body.noir { background: #000; }
  canvas { display: block; touch-action: none; }
  #loading { position: fixed; font: 600 18px system-ui, sans-serif; color: #6b5a4a; }
</style>
</head>
<body class="noir">
<div id="loading">…</div>
<canvas id="game"></canvas>
<script src="commun/ks-back.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
