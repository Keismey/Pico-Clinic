<script>
  // fiche d'installation en anglais si le jeu est en anglais (lien ?lang=, choix mémorisé ou langue du téléphone)
  (function () {
    var l = new URLSearchParams(location.search).get('lang');
    try { l = l || (JSON.parse(localStorage.getItem('pico_save_v1') || '{}').settings || {}).lang; } catch (e) {}
    l = l || ((navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en');
    if (l === 'en') document.getElementById('manifest').href = 'manifest-en.webmanifest';
  })();
</script>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* fond noir pendant le logo du studio, puis beige en fondu (bandes autour du jeu) */
  body { display: flex; align-items: center; justify-content: center; background: #e9dcc6; transition: background-color .7s; }
  body.noir { background: #000; }
  canvas { display: block; touch-action: none; }
  #loading { position: fixed; font: 600 18px system-ui, sans-serif; color: #6b5a4a; }
  /* téléphone tourné : le jeu (en portrait) serait minuscule, on demande de le redresser (même règle dans js/main.js) */
  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 600px) and (pointer: coarse) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 2147482000; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; padding: 24px; text-align: center;
      background: #f4e9d8; color: #3a2a1e; font: 700 20px system-ui, sans-serif;
    }
  }
  #rotate svg { width: 64px; height: 64px; }
  html:lang(en) #rotate .fr, html:not(:lang(en)) #rotate .en { display: none; }
</style>
</head>
